<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Správa produktů - Tomano Collection</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <div class="container">
    <div><a href="index.html">Zpět do obchodu</a></div>
    <div class="right" id="topbar-admin-status" style="display:none;"><span id="logged-in-as"></span> &middot; <a href="#" id="logout-btn">Odhlásit</a></div>
  </div>
</div>

<div class="header-main">
  <div class="container">
    <a href="index.html" class="logo">
      <img src="images/logo.jpg" alt="Tomano Collection">
    </a>
  </div>
</div>

<div class="catnav" id="admin-nav" style="display:none;">
  <div class="container">
    <a href="admin.html" class="active">Produkty</a>
    <a href="admin-orders.html">Objednávky</a>
  </div>
</div>

<div class="container" style="padding-top:30px;">

  <div id="login-view" style="max-width:380px; margin:60px auto;">
    <h1 class="page-title" style="text-align:center;">Přihlášení administrátora</h1>
    <form id="login-form" style="background:#fff; border:1px solid var(--border); border-radius:6px; padding:30px;">
      <label style="display:block; margin-bottom:14px;">
        E-mail<br>
        <input type="email" id="login-email" required style="width:100%; padding:10px; border:1px solid var(--border); margin-top:4px;">
      </label>
      <label style="display:block; margin-bottom:18px;">
        Heslo<br>
        <input type="password" id="login-password" required style="width:100%; padding:10px; border:1px solid var(--border); margin-top:4px;">
      </label>
      <div id="login-error" style="color:#c0392b; margin-bottom:12px; font-size:14px;"></div>
      <button type="submit" class="btn buy" style="width:100%; padding:12px;">Přihlásit se</button>
    </form>
  </div>

  <div id="admin-view" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <h1 class="page-title" style="margin:0;">Správa produktů</h1>
      <button id="add-product-btn" class="btn buy">+ Nový produkt</button>
    </div>

    <div class="sortbar" id="admin-cat-filter">
      <button data-cat="all" class="active">Vše</button>
      <button data-cat="draft">Draft</button>
      <button data-cat="collector">Collector</button>
      <button data-cat="set">Set</button>
    </div>

    <table class="cart-table admin-table">
      <thead>
        <tr><th>Poř.</th><th>Obrázek</th><th>Název</th><th>Kategorie</th><th>Cena</th><th>Sklad</th><th></th><th></th></tr>
      </thead>
      <tbody id="admin-table-body"></tbody>
    </table>

    <div id="form-panel" class="admin-form-panel" style="display:none;">
      <h2 id="form-title">Nový produkt</h2>
      <form id="product-form">
        <div class="admin-form-grid">
          <label>ID (slug)<br><input type="text" id="field-id" placeholder="např. mh3-dr" required></label>
          <label>Kategorie<br>
            <select id="field-cat" required>
              <option value="draft">Draft</option>
              <option value="collector">Collector</option>
              <option value="set">Set</option>
            </select>
          </label>
          <label class="span-2">Název<br><input type="text" id="field-name" required></label>
          <label>Měna ceny<br>
            <select id="field-currency">
              <option value="CZK">CZK</option>
              <option value="EUR">EUR</option>
            </select>
          </label>
          <label>Cena<br><input type="number" id="field-price" min="0" step="0.01" required></label>
          <div class="span-2" id="price-preview" style="font-size:13px; color:#888; margin-top:-8px;"></div>
          <label>Sklad (ks)<br><input type="number" id="field-stock" min="0" required></label>
          <label>Sazba DPH<br>
            <select id="field-vat">
              <option value="">— nepřiřazeno —</option>
            </select>
          </label>
          <label>Pozice v seznamu<br><input type="number" id="field-position" min="0" value="0"></label>
          <label>EAN (čárový kód)<br><input type="text" id="field-ean" inputmode="numeric" pattern="[0-9]*" placeholder="např. 0195166308036"><br><span style="font-size:12px; color:#888;">Nepovinné. Přebírá se z krabice a pomáhá Heurece produkt správně spárovat.</span></label>
          <label class="span-2">Obrázek<br><input type="file" id="field-image" accept="image/*"></label>
          <div class="span-2"><img id="image-preview" style="display:none; max-width:200px; max-height:200px; margin-top:8px;"></div>
          <label class="span-2">Popis<br><textarea id="field-desc" rows="8"></textarea></label>
        </div>

        <h3 style="margin-top:20px;">Odkazy (TCG Player, Cardmarket, ...)</h3>
        <div id="links-editor"></div>
        <button type="button" id="add-link-btn" class="btn detail" style="margin-top:8px;">+ Přidat odkaz</button>

        <div style="margin-top:24px; display:flex; gap:10px;">
          <button type="submit" id="save-btn" class="btn buy">Uložit</button>
          <button type="button" id="cancel-form-btn" class="btn detail">Zrušit</button>
        </div>
      </form>
    </div>

    <div class="admin-section-divider"></div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <h1 class="page-title" style="margin:0;">Sazby DPH</h1>
      <button id="add-vat-btn" class="btn buy">+ Nová sazba</button>
    </div>

    <table class="cart-table admin-table" style="max-width:500px;">
      <thead>
        <tr><th>Název</th><th>Sazba (%)</th><th></th><th></th></tr>
      </thead>
      <tbody id="vat-table-body"></tbody>
    </table>

    <div id="vat-form-panel" class="admin-form-panel" style="display:none; max-width:400px;">
      <h2 id="vat-form-title">Nová sazba DPH</h2>
      <form id="vat-form">
        <div class="admin-form-grid">
          <label class="span-2">Název (např. "21% - základní")<br><input type="text" id="vat-field-name" required></label>
          <label class="span-2">Sazba (%)<br><input type="number" id="vat-field-rate" step="0.01" min="0" required></label>
        </div>
        <div style="margin-top:24px; display:flex; gap:10px;">
          <button type="submit" id="vat-save-btn" class="btn buy">Uložit</button>
          <button type="button" id="vat-cancel-btn" class="btn detail">Zrušit</button>
        </div>
      </form>
    </div>
  </div>

</div>

<footer>
  <div class="container">
    <div><strong>Tomano Collection</strong> &middot; Administrace</div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/currency.js"></script>
<script src="js/admin-common.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
