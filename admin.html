<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Správa produktů - Tomano Collection</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <div class="container">
    <div><a href="index.html">Zpět do obchodu</a></div>
    <div class="right" id="topbar-admin-status" style="display:none;"><span id="logged-in-as"></span> &middot; <a href="#" id="logout-btn">Odhlásit</a></div>
  </div>
</div>

<div class="header-main">
  <div class="container">
    <a href="index.html" class="logo">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2c1 3-2 4-2 7a4 4 0 108 0c0-1.5-.7-2.3-1.3-3.1.6 2-1 3-1.7 2 .8-2.5-1-3.9-3-5.9zM8 13a4 4 0 108 0c0-2-1.6-3-2-5-2 1.5-6 2.5-6 5z" fill="#e8551f"/>
      </svg>
      <span class="logo-text">
        <span class="top">TOMANO</span>
        <span class="bottom">SPRÁVA</span>
      </span>
    </a>
  </div>
</div>

<div class="container" style="padding-top:30px;">

  <div id="login-view" style="max-width:380px; margin:60px auto;">
    <h1 class="page-title" style="text-align:center;">Přihlášení administrátora</h1>
    <form id="login-form" style="background:#fff; border:1px solid var(--border); border-radius:6px; padding:30px;">
      <label style="display:block; margin-bottom:14px;">
        E-mail<br>
        <input type="email" id="login-email" required style="width:100%; padding:10px; border:1px solid var(--border); margin-top:4px;">
      </label>
      <label style="display:block; margin-bottom:18px;">
        Heslo<br>
        <input type="password" id="login-password" required style="width:100%; padding:10px; border:1px solid var(--border); margin-top:4px;">
      </label>
      <div id="login-error" style="color:#c0392b; margin-bottom:12px; font-size:14px;"></div>
      <button type="submit" class="btn buy" style="width:100%; padding:12px;">Přihlásit se</button>
    </form>
  </div>

  <div id="admin-view" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <h1 class="page-title" style="margin:0;">Správa produktů</h1>
      <button id="add-product-btn" class="btn buy">+ Nový produkt</button>
    </div>

    <table class="cart-table admin-table">
      <thead>
        <tr><th>Obrázek</th><th>Název</th><th>Kategorie</th><th>Cena</th><th>Sklad</th><th></th><th></th></tr>
      </thead>
      <tbody id="admin-table-body"></tbody>
    </table>

    <div id="form-panel" class="admin-form-panel" style="display:none;">
      <h2 id="form-title">Nový produkt</h2>
      <form id="product-form">
        <div class="admin-form-grid">
          <label>ID (slug)<br><input type="text" id="field-id" placeholder="např. mh3-dr" required></label>
          <label>Kategorie<br>
            <select id="field-cat" required>
              <option value="draft">Draft</option>
              <option value="collector">Collector</option>
              <option value="set">Set</option>
            </select>
          </label>
          <label class="span-2">Název<br><input type="text" id="field-name" required></label>
          <label>Cena (Kč)<br><input type="number" id="field-price" min="0" required></label>
          <label>Cena (EUR)<br><input type="number" id="field-eur" min="0" required></label>
          <label>Sklad (ks)<br><input type="number" id="field-stock" min="0" required></label>
          <label class="span-2">Obrázek<br><input type="file" id="field-image" accept="image/*"></label>
          <div class="span-2"><img id="image-preview" style="display:none; max-width:200px; max-height:200px; margin-top:8px;"></div>
          <label class="span-2">Popis<br><textarea id="field-desc" rows="8"></textarea></label>
        </div>

        <h3 style="margin-top:20px;">Odkazy (TCG Player, Cardmarket, ...)</h3>
        <div id="links-editor"></div>
        <button type="button" id="add-link-btn" class="btn detail" style="margin-top:8px;">+ Přidat odkaz</button>

        <div style="margin-top:24px; display:flex; gap:10px;">
          <button type="submit" id="save-btn" class="btn buy">Uložit</button>
          <button type="button" id="cancel-form-btn" class="btn detail">Zrušit</button>
        </div>
      </form>
    </div>
  </div>

</div>

<footer>
  <div class="container">
    <div><strong>Tomano Collection</strong> &middot; Administrace</div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
